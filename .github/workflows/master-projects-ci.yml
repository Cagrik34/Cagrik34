name: ⚡ Centralized Personal Projects Master CI & Security Matrix

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC (06:00 TRT)
  workflow_dispatch:
    inputs:
      target_project:
        description: 'Select project to audit (or "all" for 360 matrix)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'zenith-nexus'
          - 'zenith-atlas'
          - 'microsoft-foundry-local-rag-assistant'
          - 'hybrid-rag-action'
          - 'python-utilities'

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # 1. Zenith Nexus (Developer Intelligence OS)
  # -------------------------------------------------------------
  audit-zenith-nexus:
    name: ⚡ Zenith Nexus (Vitest, TS, Security & Bundle)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'zenith-nexus' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: 📥 Checkout Zenith Nexus
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zenith-nexus

      - name: ⚙️ Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔒 High-Severity Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: 🔍 Static Type Checking
        run: npx tsc -b

      - name: 🧪 Execute Vitest Test Suite
        run: npm test -- --run

      - name: 🏗️ Compile Optimized Production Bundle
        run: npm run build

  # -------------------------------------------------------------
  # 2. Zenith Atlas (Quant Analytics Terminal)
  # -------------------------------------------------------------
  audit-zenith-atlas:
    name: 📊 Zenith Atlas (Quant Engines, Security & PWA)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'zenith-atlas' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: 📥 Checkout Zenith Atlas
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zenith-atlas

      - name: ⚙️ Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔒 High-Severity Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: 🧪 Run Quantitative Engines & Security Suite (23 Tests)
        run: npm test -- --run

      - name: 🏗️ Build Production Bundle & PWA ServiceWorker
        run: npm run build

  # -------------------------------------------------------------
  # 3. Microsoft Foundry Local RAG Assistant (Zenith AI)
  # -------------------------------------------------------------
  audit-zenith-ai-rag:
    name: 🧠 Zenith AI (Local RAG Pipeline & Fullstack)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'microsoft-foundry-local-rag-assistant' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: 📥 Checkout Zenith AI
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/microsoft-foundry-local-rag-assistant

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 fastapi uvicorn pydantic numpy requests pypdf python-docx openpyxl python-pptx httpx python-multipart

      - name: 🔍 Python Flake8 Linting
        run: flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧪 Execute Python CI Test Suite
        run: python -m unittest tests/test_ci_pipeline.py -v

      - name: 🏗️ Frontend Typecheck & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # -------------------------------------------------------------
  # 4. Hybrid RAG Action (GitHub Actions Plugin)
  # -------------------------------------------------------------
  audit-hybrid-rag-action:
    name: 🛡️ Hybrid RAG Action (BM25, Dense & RRF Suite)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'hybrid-rag-action' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: 📥 Checkout Hybrid RAG Action
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/hybrid-rag-action

      - name: ⚙️ Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔒 Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: 🧪 Run Hybrid RAG Verification Suite
        run: npm test

  # -------------------------------------------------------------
  # 5. Standalone Python Projects
  # -------------------------------------------------------------
  audit-python-utilities:
    name: 📐 Python Utility Repositories (Syntax & Imports)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target_project == 'all' || github.event.inputs.target_project == 'python-utilities' || github.event_name != 'workflow_dispatch' }}
    steps:
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 Checkout euclidean-distance-calculator
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/euclidean-distance-calculator
          path: euclidean-distance-calculator

      - name: 📥 Checkout RealTime-Face-Emotion-Recognition
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealTime-Face-Emotion-Recognition
          path: RealTime-Face-Emotion-Recognition

      - name: 🔍 Validate Python Syntax & Execution
        run: |
          python -m py_compile euclidean-distance-calculator/*.py
          python -m py_compile RealTime-Face-Emotion-Recognition/*.py
          echo "All Python utilities compiled successfully with zero syntax errors."

  # -------------------------------------------------------------
  # 6. Master Summary Reporter
  # -------------------------------------------------------------
  master-summary-report:
    name: 📋 Generate Master Audit Report
    runs-on: ubuntu-latest
    needs:
      - audit-zenith-nexus
      - audit-zenith-atlas
      - audit-zenith-ai-rag
      - audit-hybrid-rag-action
      - audit-python-utilities
    if: always()
    steps:
      - name: 📊 Publish Centralized Health Matrix to Step Summary
        uses: actions/github-script@v8
        with:
          script: |
            const nexusStatus = "${{ needs.audit-zenith-nexus.result }}";
            const atlasStatus = "${{ needs.audit-zenith-atlas.result }}";
            const aiStatus = "${{ needs.audit-zenith-ai-rag.result }}";
            const ragActionStatus = "${{ needs.audit-hybrid-rag-action.result }}";
            const pyUtilStatus = "${{ needs.audit-python-utilities.result }}";

            const badge = (status) => {
              if (status === 'success') return '🟢 PASS (Healthy)';
              if (status === 'skipped') return '⚪ SKIPPED';
              return '🔴 FAILED';
            };

            let markdown = `## ⚡ Centralized Personal Projects Master Audit Report\n\n`;
            markdown += `**Execution Timestamp:** \`${new Date().toISOString()}\`\n`;
            markdown += `**Trigger Source:** \`${context.eventName}\`\n\n`;
            markdown += `| Project | Ecosystem & Runtime | Security Audit | Automated Tests | CI Status |\n`;
            markdown += `| :--- | :---: | :---: | :---: | :---: |\n`;
            markdown += `| **[Zenith Nexus](https://github.com/${context.repo.owner}/zenith-nexus)** | Node.js 22 LTS / React 19 | \`npm audit (High)\` | 7 Tests (Vitest + TS) | ${badge(nexusStatus)} |\n`;
            markdown += `| **[Zenith Atlas](https://github.com/${context.repo.owner}/zenith-atlas)** | Node.js 22 LTS / Vite 6 | \`npm audit (High)\` | 23 Quant Tests + PWA | ${badge(atlasStatus)} |\n`;
            markdown += `| **[Zenith AI (Local RAG)](https://github.com/${context.repo.owner}/microsoft-foundry-local-rag-assistant)** | Python 3.11 + Node 22 | Flake8 + Deps | 17 Backend + Frontend | ${badge(aiStatus)} |\n`;
            markdown += `| **[Hybrid RAG Action](https://github.com/${context.repo.owner}/hybrid-rag-action)** | Node.js 22 LTS | \`npm audit (High)\` | 5 Retrieval Suites | ${badge(ragActionStatus)} |\n`;
            markdown += `| **[Python Utilities](https://github.com/${context.repo.owner}/euclidean-distance-calculator)** | Python 3.11 | Syntax & Bytecode | py_compile Validation | ${badge(pyUtilStatus)} |\n\n`;
            markdown += `> **System Health:** All target repositories are continuously monitored for CVE security vulnerabilities, runtime deprecations, and test regressions.`;

            await core.summary.addRaw(markdown).write();
